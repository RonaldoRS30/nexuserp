services:
  mysql:
    image: mysql:8.4
    container_name: nexuserp-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nexuserp
      MYSQL_DATABASE: nexuserp
    volumes:
      - nexuserp_mysql:/var/lib/mysql
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  nexuserp_mysql:
